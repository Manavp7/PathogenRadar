services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PATHOGENRADAR_REGION=kerala
      - LLM_PROVIDER=template
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python scripts/seed.py &&
             uvicorn pathogenradar.api.main:app --app-dir backend --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
